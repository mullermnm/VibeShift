<!DOCTYPE html>
<html>
<head>
  <title>VibeShift Icon Generator</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #ccc; margin: 10px; }
    .icon-row { display: flex; align-items: center; gap: 20px; margin: 20px 0; }
    button { padding: 10px 20px; cursor: pointer; }
    a { display: inline-block; margin: 10px; padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>VibeShift Icon Generator</h1>
  <p>Click the buttons below to generate and download PNG icons.</p>
  
  <div class="icon-row">
    <div>
      <h3>16x16</h3>
      <canvas id="canvas16" width="16" height="16"></canvas>
      <br><a id="download16" download="icon16.png">Download 16px</a>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="canvas48" width="48" height="48"></canvas>
      <br><a id="download48" download="icon48.png">Download 48px</a>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="canvas128" width="128" height="128"></canvas>
      <br><a id="download128" download="icon128.png">Download 128px</a>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const radius = size * 0.45;
      
      // Create gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(0.5, '#764ba2');
      gradient.addColorStop(1, '#f093fb');
      
      // Draw circle background
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      
      // Draw leaf/vibe shape
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      const leafWidth = size * 0.15;
      const leafHeight = size * 0.35;
      
      ctx.moveTo(center, center - leafHeight);
      ctx.bezierCurveTo(
        center + leafWidth, center - leafHeight * 0.5,
        center + leafWidth, center + leafHeight * 0.5,
        center, center + leafHeight * 0.3
      );
      ctx.bezierCurveTo(
        center - leafWidth, center + leafHeight * 0.5,
        center - leafWidth, center - leafHeight * 0.5,
        center, center - leafHeight
      );
      ctx.fill();
      
      // Draw center dot
      if (size >= 48) {
        ctx.beginPath();
        ctx.arc(center, center, size * 0.08, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
      }
    }
    
    // Draw all icons
    const sizes = [16, 48, 128];
    sizes.forEach(size => {
      const canvas = document.getElementById('canvas' + size);
      drawIcon(canvas, size);
      
      // Set download link
      const link = document.getElementById('download' + size);
      link.href = canvas.toDataURL('image/png');
    });
  </script>
</body>
</html>
